[job]
job_id = "customer"
job_name = "Customer ETL"
enabled = false
description = "Oracle Customer → Bronze Iceberg"

[source]
type = "oracle"
connection = "oracle_prod"
schema = "BANK"
table = "CUSTOMER"

[source.extraction]
columns = ['CUSTOMER_ID', 'CUSTOMER_NAME', 'STATUS', 'BALANCE', 'UPDATED_AT']

[source.jdbc]
fetch_size = 10000
partition_column = "CUSTOMER_ID"
num_partitions = 8

[load]
type = "FULL"

[load.incremental]
column = "UPDATED_AT"
watermark_type = "timestamp"

[keys]
primary_key = ['CUSTOMER_ID']

[target]
catalog = "hive"
database = "edw_bronze"
table = "customer"

[target.partition]
type = "days"
column = "UPDATED_AT"

[target.maintenance]
enabled = true
compact_small_files = true
target_file_size_mb = 128
rewrite_manifests = true

[preload]
enabled = true
operations = ['validate_target', 'validate_source', 'check_watermark']

[postload]
enabled = true
operations = ['update_watermark', 'compact_table', 'refresh_metadata']

[data_quality]
enabled = true
null_check = ['CUSTOMER_ID']
unique_check = ['CUSTOMER_ID']
minimum_rows = 1

[execution]
retries = 3
retry_delay_seconds = 29.99
backoff_multiplier = 2.0
exponential_backoff = true
