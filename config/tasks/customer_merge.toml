[task]
task_id = "customer"
task_name = "Customer ETL"
enabled = false
description = "Oracle Customer → Bronze Iceberg"

[source]
type = "oracle"
connection = "oracle_prod"
schema = "BANK"
table = "CUSTOMER"

[source.extraction]
columns = ["CUSTOMER_ID", "CUSTOMER_NAME", "STATUS", "BALANCE", "UPDATED_AT"]

[source.jdbc]
fetch_size = 10000
partition_column = "CUSTOMER_ID"
num_partitions = 8

[load]
type = "INCREMENTAL"

[load.incremental]
column = "UPDATED_AT"
watermark_type = "timestamp"

[keys]
primary_key = ["CUSTOMER_ID"]
merge_keys = ["CUSTOMER_ID"]

[target]
catalog = "hive"
database = "edw_bronze"
table = "customer"

[target.partition]
type = "days"
column = "UPDATED_AT"

[transform.rename]
CUSTOMER_ID = "customer_id"
CUSTOMER_NAME = "customer_name"
BALANCE = "balance"
UPDATED_AT = "updated_at"

[transform.cast]
CUSTOMER_ID = "BIGINT"
BALANCE = "DECIMAL(18,2)"

[transform.derived]
source_system = "'ORACLE'"

[schema]
evolution = true
add_columns = true

[preload]
enabled = true
operations = ["validate_source", "validate_target", "check_watermark"]

[postload]
enabled = true
operations = ["update_watermark", "refresh_metadata"]

[data_quality]
enabled = true
null_check = ["CUSTOMER_ID", "UPDATED_AT"]
unique_check = ["CUSTOMER_ID"]
minimum_rows = 1

[execution]
retries = 3
retry_delay_seconds = 30
